<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#B45309" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <g filter="url(#shadow)">
    <!-- Mango Fruit Shape -->
    <path d="M210 70 C240 70 280 110 270 170 C260 230 200 250 160 230 C120 210 120 150 150 100 C170 70 190 70 210 70 Z" fill="url(#mangoGrad)" />
    
    <!-- Mango Beak Curve -->
    <path d="M160 230 C145 220 140 200 148 185" stroke="#EA580C" stroke-width="3" fill="none" opacity="0.4" />
    
    <!-- Highlight -->
    <ellipse cx="230" cy="120" rx="25" ry="14" transform="rotate(-20 230 120)" fill="#FFFFFF" opacity="0.3" />

    <!-- Stem and Leaf -->
    <path d="M210 70 C210 50 200 40 195 35" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M205 60 C170 50 140 65 130 80 C150 85 185 80 205 60 Z" fill="#15803D" />
  </g>
  
  <rect x="24" y="24" width="125" height="24" rx="6" fill="#EA580C" fill-opacity="0.15" />
  <text x="86" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9A3412" text-anchor="middle">ALPHONSO HAPUS</text>
</svg>
