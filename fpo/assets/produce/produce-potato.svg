<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="potatoBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#854D0E" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Back Potato -->
  <g filter="url(#shadow)">
    <ellipse cx="260" cy="140" rx="75" ry="60" transform="rotate(15 260 140)" fill="#A16207" opacity="0.8" />
    <circle cx="280" cy="120" r="3" fill="#713F12" />
    <circle cx="230" cy="150" r="2.5" fill="#713F12" />
  </g>

  <!-- Front Potato -->
  <g filter="url(#shadow)">
    <path d="M120 180 C100 130 140 90 200 95 C250 100 270 140 260 185 C250 225 180 235 135 220 C115 210 110 195 120 180 Z" fill="url(#potatoBrown)" />
    <!-- Potato Eyes & Pits -->
    <ellipse cx="160" cy="130" rx="30" ry="15" transform="rotate(-15 160 130)" fill="#FFFFFF" opacity="0.2" />
    <circle cx="150" cy="140" r="4" fill="#713F12" opacity="0.7" />
    <circle cx="190" cy="170" r="3.5" fill="#713F12" opacity="0.6" />
    <circle cx="220" cy="135" r="4" fill="#713F12" opacity="0.7" />
    <circle cx="155" cy="190" r="3" fill="#713F12" opacity="0.6" />
  </g>
  
  <rect x="24" y="24" width="115" height="24" rx="6" fill="#CA8A04" fill-opacity="0.15" />
  <text x="81" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle">JYOTI TABLE</text>
</svg>
