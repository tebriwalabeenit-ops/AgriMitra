<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mustardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="mustardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <filter id="mustardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#713F12" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#mustardBgGrad)" rx="16" />
  
  <g filter="url(#mustardShadow)">
    <!-- Mustard pods -->
    <path d="M120 250 Q160 160 210 100" stroke="#65A30D" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M180 180 Q210 130 250 80" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Pod 1 -->
    <path d="M210 100 Q240 70 270 60 Q250 85 210 100 Z" fill="#65A30D" stroke="#3F6212" stroke-width="1.5" />
    <!-- Pod 2 -->
    <path d="M175 140 Q215 110 245 90 Q225 120 175 140 Z" fill="#84CC16" stroke="#4D7C0F" stroke-width="1.5" />
    
    <!-- Mustard seeds scattered -->
    <circle cx="160" cy="200" r="10" fill="url(#mustardGrad)" />
    <circle cx="185" cy="215" r="9" fill="url(#mustardGrad)" />
    <circle cx="210" cy="195" r="11" fill="url(#mustardGrad)" />
    <circle cx="235" cy="210" r="10" fill="url(#mustardGrad)" />
    <circle cx="170" cy="230" r="8" fill="url(#mustardGrad)" />
    <circle cx="220" cy="225" r="9" fill="url(#mustardGrad)" />
  </g>
  
  <rect x="24" y="24" width="145" height="24" rx="6" fill="#CA8A04" fill-opacity="0.15" />
  <text x="96" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#713F12" text-anchor="middle">YELLOW MUSTARD</text>
</svg>
