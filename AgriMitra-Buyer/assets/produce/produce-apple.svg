      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <linearGradient id="appleRed" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#881337" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <g filter="url(#shadow)">
    <!-- Apple Body -->
    <path d="M195 95 C175 75 140 85 130 120 C115 170 145 240 185 240 C195 240 200 235 205 235 C210 235 215 240 225 240 C265 240 295 170 280 120 C270 85 235 75 215 95 C205 105 200 100 195 95 Z" fill="url(#appleRed)" />
    
