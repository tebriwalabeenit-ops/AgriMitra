    <!-- Stem and Leaf -->
    <path d="M205 95 C208 70 215 50 225 45" stroke="#78350F" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M212 68 C235 55 255 65 260 75 C245 85 225 80 212 68 Z" fill="#15803D" />
  </g>
  
  <rect x="24" y="24" width="120" height="24" rx="6" fill="#E11D48" fill-opacity="0.15" />
  <text x="84" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9F1239" text-anchor="middle">SHIMLA ROYAL</text>
