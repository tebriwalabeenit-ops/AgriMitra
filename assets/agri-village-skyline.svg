<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120" preserveAspectRatio="none">
  <!-- Indian Rural Village & Farmland Horizon Silhouette -->
  <defs>
    <linearGradient id="skylineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C5A35" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#1C5A35" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1C5A35" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Distant gentle hill contours -->
  <path d="M0 80 Q 200 45 400 70 T 800 60 T 1200 75 L 1200 120 L 0 120 Z" fill="#1C5A35" opacity="0.08"/>

  <!-- Midground Village, Thatched Cottages, Trees & Farming -->
  <!-- Thatched Hut 1 (Far Left) -->
  <polygon points="60,78 85,55 110,78" fill="#1C5A35" opacity="0.25"/>
  <rect x="68" y="78" width="34" height="26" fill="#1C5A35" opacity="0.25"/>
  <rect x="80" y="88" width="10" height="16" fill="#FFFFFF" opacity="0.4"/>

  <!-- Small Banyan Tree Silhouette -->
  <path d="M125 104 L 128 75 C 110 70 100 50 120 40 C 130 30 155 32 165 42 C 180 38 190 55 178 70 C 185 80 160 85 140 78 L 138 104 Z" fill="#1C5A35" opacity="0.3"/>
  <!-- Aerial roots -->
  <line x1="120" y1="70" x2="120" y2="102" stroke="#1C5A35" stroke-width="1.2" opacity="0.25"/>
  <line x1="165" y1="68" x2="165" y2="102" stroke="#1C5A35" stroke-width="1.2" opacity="0.25"/>

  <!-- Birds in Flight -->
  <path d="M185 30 Q 192 24 199 30 Q 206 24 213 30" stroke="#1C5A35" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M220 22 Q 225 17 230 22 Q 235 17 240 22" stroke="#1C5A35" stroke-width="1.2" fill="none" opacity="0.35"/>
  <path d="M205 38 Q 209 33 214 38 Q 219 33 224 38" stroke="#1C5A35" stroke-width="1.2" fill="none" opacity="0.35"/>

  <!-- Tractor working in field (center-left) -->
  <g transform="translate(320, 72)" fill="#1C5A35" opacity="0.35">
    <rect x="15" y="10" width="22" height="12" rx="2"/>
    <path d="M22 10 L 22 2 L 35 2 L 35 10 Z"/>
    <circle cx="17" cy="24" r="6"/>
    <circle cx="37" cy="21" r="9"/>
    <!-- Farmer driver silhouette -->
    <circle cx="28" cy="0" r="3.5"/>
  </g>

  <!-- Village Thatched Cottages Cluster (Center) -->
  <polygon points="520,74 545,52 570,74" fill="#1C5A35" opacity="0.28"/>
  <rect x="526" y="74" width="38" height="28" fill="#1C5A35" opacity="0.28"/>
  <polygon points="565,72 590,48 615,72" fill="#1C5A35" opacity="0.35"/>
  <rect x="572" y="72" width="36" height="30" fill="#1C5A35" opacity="0.35"/>
  <polygon points="610,76 630,58 650,76" fill="#1C5A35" opacity="0.24"/>
  <rect x="616" y="76" width="28" height="26" fill="#1C5A35" opacity="0.24"/>
  <!-- Palm Trees behind village -->
  <path d="M660 102 Q 658 65 655 42" stroke="#1C5A35" stroke-width="2.5" fill="none" opacity="0.35"/>
  <path d="M655 42 Q 635 36 625 45 M 655 42 Q 645 28 640 20 M 655 42 Q 665 24 675 22 M 655 42 Q 675 32 685 40 M 655 42 Q 668 50 675 58" stroke="#1C5A35" stroke-width="1.8" fill="none" opacity="0.35"/>

  <!-- Desi Farm-to-Mandi Transport Carrier (Center-Right) -->
  <g transform="translate(780, 70)" fill="#1C5A35" opacity="0.35">
    <rect x="10" y="8" width="45" height="24" rx="2"/>
    <path d="M55 14 L 68 14 L 76 25 L 76 32 L 55 32 Z"/>
    <circle cx="24" cy="34" r="7"/>
    <circle cx="68" cy="34" r="7"/>
  </g>

  <!-- Mandi Shed Silhouette in distance (Right) -->
  <polygon points="960,65 1010,42 1060,65" fill="#1C5A35" opacity="0.28"/>
  <line x1="975" y1="65" x2="975" y2="105" stroke="#1C5A35" stroke-width="2.5" opacity="0.3"/>
  <line x1="1045" y1="65" x2="1045" y2="105" stroke="#1C5A35" stroke-width="2.5" opacity="0.3"/>
  <polygon points="1050,68 1090,48 1130,68" fill="#1C5A35" opacity="0.22"/>
  <line x1="1065" y1="68" x2="1065" y2="105" stroke="#1C5A35" stroke-width="2.5" opacity="0.25"/>
  <line x1="1115" y1="68" x2="1115" y2="105" stroke="#1C5A35" stroke-width="2.5" opacity="0.25"/>

  <!-- Baseline Soil & Furrow Layer -->
  <path d="M0 102 Q 300 95 600 100 T 1200 98 L 1200 120 L 0 120 Z" fill="url(#skylineGrad)"/>
</svg>
