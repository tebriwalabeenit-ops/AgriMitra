<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="deliveryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C5A35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2E7D32" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Highway Road Line -->
  <line x1="8" y1="136" x2="152" y2="136" stroke="#1C5A35" stroke-width="3" opacity="0.45"/>
  <line x1="18" y1="142" x2="48" y2="142" stroke="#1C5A35" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>
  <line x1="68" y1="142" x2="98" y2="142" stroke="#1C5A35" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>
  <line x1="118" y1="142" x2="148" y2="142" stroke="#1C5A35" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>

  <!-- Indian Agricultural Freight Carrier Truck -->
  <!-- Truck Cargo Bay -->
  <rect x="20" y="65" width="75" height="55" rx="4" fill="url(#deliveryGrad)" stroke="#1C5A35" stroke-width="2.5"/>
  <line x1="20" y1="84" x2="95" y2="84" stroke="#1C5A35" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="102" x2="95" y2="102" stroke="#1C5A35" stroke-width="1.5" opacity="0.4"/>
  <!-- Produce Cargo in Truck -->
  <circle cx="38" cy="59" r="9" fill="#1C5A35" opacity="0.5"/>
  <circle cx="56" cy="56" r="10" fill="#1C5A35" opacity="0.55"/>
  <circle cx="75" cy="58" r="9" fill="#1C5A35" opacity="0.5"/>

  <!-- Truck Cab -->
  <path d="M95 80 L 120 80 L 134 100 L 134 120 L 95 120 Z" fill="#1C5A35" opacity="0.5" stroke="#1C5A35" stroke-width="2.5"/>
  <path d="M100 86 L 117 86 L 126 99 L 100 99 Z" fill="#FFFFFF" opacity="0.85"/>
  <!-- Headlight -->
  <rect x="131" y="106" width="4" height="6" rx="1.5" fill="#EAB308" opacity="0.9"/>

  <!-- Heavy Duty Wheels -->
  <circle cx="45" cy="122" r="12" fill="#1C5A35" opacity="0.85"/>
  <circle cx="45" cy="122" r="5" fill="#FFFFFF"/>
  <circle cx="116" cy="122" r="12" fill="#1C5A35" opacity="0.85"/>
  <circle cx="116" cy="122" r="5" fill="#FFFFFF"/>

  <!-- GPS Live Tracking Beams -->
  <g transform="translate(68, 25)" stroke="#1C5A35" fill="none">
    <path d="M-18 8 A 20 20 0 0 1 18 8" stroke-width="2.5" opacity="0.5"/>
    <path d="M-10 13 A 12 12 0 0 1 10 13" stroke-width="2" opacity="0.65"/>
    <circle cx="0" cy="18" r="3" fill="#1C5A35" opacity="0.85"/>
  </g>
</svg>
