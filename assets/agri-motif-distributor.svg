<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="distGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C5A35" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2E7D32" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Agricultural Distribution Warehouse -->
  <polygon points="18,72 80,36 142,72" fill="url(#distGrad)" stroke="#1C5A35" stroke-width="2.5"/>
  <rect x="24" y="72" width="112" height="60" fill="#1C5A35" opacity="0.18" stroke="#1C5A35" stroke-width="2.5"/>

  <!-- High-capacity Loading Bay Rollup Doors -->
  <rect x="36" y="90" width="32" height="42" fill="#1C5A35" opacity="0.45"/>
  <line x1="36" y1="98" x2="68" y2="98" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="36" y1="106" x2="68" y2="106" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="36" y1="114" x2="68" y2="114" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="36" y1="122" x2="68" y2="122" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

  <!-- Multi-tier Pallet Racks and Wholesale Crates -->
  <rect x="82" y="98" width="38" height="14" rx="2" fill="#1C5A35" opacity="0.6"/>
  <rect x="86" y="84" width="32" height="13" rx="2" fill="#1C5A35" opacity="0.6"/>
  <rect x="90" y="71" width="24" height="12" rx="2" fill="#1C5A35" opacity="0.6"/>

  <!-- Supply Chain Logistics Network Nodes -->
  <circle cx="26" cy="45" r="5" fill="#1C5A35" opacity="0.8"/>
  <circle cx="80" cy="22" r="6" fill="#1C5A35" opacity="0.9"/>
  <circle cx="134" cy="45" r="5" fill="#1C5A35" opacity="0.8"/>
  <line x1="26" y1="45" x2="80" y2="22" stroke="#1C5A35" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
  <line x1="80" y1="22" x2="134" y2="45" stroke="#1C5A35" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
</svg>
