  <path d="M85 56 C 70 53 72 67 85 70 C 98 67 100 53 85 56 Z" fill="url(#farmerGrad)"/>
  <path d="M85 73 C 72 70 74 84 85 87 C 96 84 98 70 85 73 Z" fill="url(#farmerGrad)"/>

