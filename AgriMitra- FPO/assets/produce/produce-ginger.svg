<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="gingerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350F" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <g filter="url(#shadow)">
    <!-- Ginger Knobs and Rhizome -->
    <path d="M120 180 C110 150 130 130 160 140 C170 110 200 100 230 120 C250 90 280 100 290 130 C310 140 320 170 300 195 C280 220 250 210 230 225 C200 240 160 230 140 210 C120 210 115 195 120 180 Z" fill="url(#gingerGrad)" />
    
    <!-- Skin Rings & Knots -->
    <path d="M140 160 Q155 170 150 185" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M190 135 Q205 150 200 170" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M250 130 Q265 145 260 165" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M220 185 Q240 195 240 210" stroke="#78350F" stroke-width="2.5" fill="none" opacity="0.4" />
  </g>
  
  <rect x="24" y="24" width="115" height="24" rx="6" fill="#D97706" fill-opacity="0.15" />
  <text x="81" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">DESI GINGER</text>
</svg>
