<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <g filter="url(#shadow)">
    <!-- Outer Green Leaves -->
    <path d="M120 220 C80 180 90 120 120 100 C140 140 130 180 140 220 Z" fill="#15803D" />
    <path d="M280 220 C320 180 310 120 280 100 C260 140 270 180 260 220 Z" fill="#15803D" />
    <path d="M200 250 C130 260 100 210 120 190 C150 220 180 230 200 250 Z" fill="#166534" />
    <path d="M200 250 C270 260 300 210 280 190 C250 220 220 230 200 250 Z" fill="#166534" />

    <!-- Dense White Curds -->
    <circle cx="160" cy="140" r="42" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="240" cy="140" r="42" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="200" cy="110" r="45" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="200" cy="170" r="50" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="150" cy="180" r="38" fill="#E2E8F0" />
    <circle cx="250" cy="180" r="38" fill="#E2E8F0" />
    <circle cx="200" cy="155" r="44" fill="#FFFFFF" />

    <!-- Front Protective Leaf Spikes -->
    <path d="M150 230 C120 190 140 140 160 150 C150 180 160 200 170 230 Z" fill="#22C55E" />
    <path d="M250 230 C280 190 260 140 240 150 C250 180 240 200 230 230 Z" fill="#22C55E" />
  </g>
  
  <rect x="24" y="24" width="115" height="24" rx="6" fill="#15803D" fill-opacity="0.15" />
  <text x="81" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">SNOWBALL A</text>
</svg>
